name: Verify macOS desktop

on:
  pull_request:
    paths:
      - ".github/workflows/macos-check.yml"
      - "src-tauri/**"
      - "src/desktop/**"
      - "cli/**"
      - "scripts/install-macos.sh"
      - "scripts/install-macos.test.ts"
      - "scripts/package-macos-qd-release.ts"
      - "scripts/public-config.ts"
      - "scripts/run-tauri.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  QUICKDROP_PUBLIC_BASE_URL: ${{ vars.QUICKDROP_PUBLIC_BASE_URL }}
  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}

jobs:
  macos-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            src-tauri

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Validate frontend and installer
        run: |
          bun run typecheck
          bun run desktop:build:web
          bun test scripts/install-macos.test.ts scripts/generate-tauri-update-manifest.test.ts
          bash -n scripts/install-macos.sh

      - name: Test native applications
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path cli/Cargo.toml

  macos-full-build:
    if: github.event_name == 'workflow_dispatch'
    needs: macos-check
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            src-tauri

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Apple Silicon desktop and qd
        run: |
          bun run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg
          cargo build --release --target aarch64-apple-darwin --manifest-path cli/Cargo.toml

      - name: Build Intel desktop and qd
        run: |
          bun run tauri -- build --ci --target x86_64-apple-darwin --bundles app,dmg
          cargo build --release --target x86_64-apple-darwin --manifest-path cli/Cargo.toml

      - name: Validate release packaging and checksums
        run: bun run scripts/package-macos-qd-release.ts
