name: Verify macOS desktop

on:
  pull_request:
    paths:
      - ".github/workflows/macos-check.yml"
      - "desktop-gpui/**"
      - "cli/**"
      - "scripts/install-macos*"
      - "scripts/package-macos-qd-release.ts"
      - "scripts/package-desktop-release.ts"
      - "scripts/desktop-release*"
      - "scripts/generate-desktop-update-manifest*"
      - "scripts/public-config*"
      - "scripts/run-gpui.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  QUICKDROP_PUBLIC_BASE_URL: ${{ vars.QUICKDROP_PUBLIC_BASE_URL }}
  QUICKDROP_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  macos-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            desktop-gpui

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Validate installer and release contracts
        run: |
          bun run typecheck
          bun test scripts/install-macos.test.ts scripts/generate-desktop-update-manifest.test.ts scripts/desktop-release.test.ts scripts/public-config.test.ts scripts/release.test.ts
          bash -n scripts/install-macos.sh

      - name: Test native applications
        run: |
          cargo test --locked --manifest-path desktop-gpui/Cargo.toml
          cargo test --locked --manifest-path cli/Cargo.toml

  macos-full-build:
    if: github.event_name == 'workflow_dispatch'
    needs: macos-check
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            desktop-gpui

      - name: Install signing tool
        run: bun install --frozen-lockfile

      - name: Build Apple Silicon desktop and qd
        run: |
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path desktop-gpui/Cargo.toml
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path cli/Cargo.toml

      - name: Build Intel desktop and qd
        run: |
          cargo build --locked --release --target x86_64-apple-darwin --manifest-path desktop-gpui/Cargo.toml
          cargo build --locked --release --target x86_64-apple-darwin --manifest-path cli/Cargo.toml

      - name: Validate signed release packaging and checksums
        run: bun run scripts/package-macos-qd-release.ts
