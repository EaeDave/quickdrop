name: Release Windows qd

on:
  pull_request:
    paths:
      - .github/workflows/release-windows-qd.yml
      - cli/**
      - scripts/package-windows-qd-release.ts
      - package.json
      - src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v0.1.1
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: oven-sh/setup-bun@v2

      - name: Build Windows CLI and TUI
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path cli/Cargo.toml

      - name: Package release assets
        run: bun run qd:package:windows

      - name: Upload assets to release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release upload $env:RELEASE_TAG `
            "cli/target/release/qd_${version}_x86_64-windows.exe" `
            "cli/target/release/qd_${version}_x86_64-windows.exe.sha256" `
            --clobber
